name: Java CI with Maven

# 1. Kích hoạt workflow khi có sự kiện push hoặc pull_request
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Lấy mã nguồn từ kho lưu trữ (repository)
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bước 2: Cài đặt môi trường Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 2. Thực thi vòng đời Maven: chạy test và package
      - name: Build and Test with Maven
        run: mvn -B clean test package --file pom.xml

      # 3. Lưu giữ và xác minh tệp .jar được tạo ra
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-java-app-jar
          path: target/*.jar